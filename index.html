  <section class="seccion info">
    <h2>¿Por qué ayudar a limpiar las playas?</h2>

      Cada año, más de 8 millones de toneladas de plástico terminan en los océanos.  
      El 80% proviene de actividades humanas en tierra.  
      ¡Tú puedes ser parte del cambio! 🌍🌊
    </p>
  </section>
